[project]
name = "ml-churn"
version = "0.1.0"
description = "ML service for customer churn prediction"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
